server:
  port: ${SERVER_PORT}

spring:
  reactor:
    context-propagation: auto
  application:
    name: gateway-service

  cloud:
    loadbalancer:
      cache:
        enabled: false

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          # 외부 식별 Header와 Browser Session Cookie의 Gateway 경계 차단
          default-filters:
            - name: RemoveRequestHeader
              args:
                name: X-User-Id
            - name: RemoveRequestHeader
              args:
                name: X-Global-Role
            - name: RemoveRequestHeader
              args:
                name: Cookie
            - name: RemoveRequestHeader
              args:
                name: Baggage
            - name: RemoveResponseHeader
              args:
                name: Set-Cookie

          routes:
            - id: identity-service-route
              uri: ${IDENTITY_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/users/**

            # Identity 관리자 API: 사용자 목록 조회
            # SYSTEM_ADMIN 권한 검증은 Identity의 보호 API 경계가 소유
            - id: identity-service-admin-users-route
              uri: ${IDENTITY_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/admin/users
                - name: Method
                  args:
                    methods.0: GET

            # Identity 관리자 API: 계정 상태 변경 Endpoint만 외부 공개
            - id: identity-service-admin-account-status-route
              uri: ${IDENTITY_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/admin/accounts/{user-id}/status
                - name: Method
                  args:
                    methods.0: PATCH

            - id: learning-service-route
              uri: ${LEARNING_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/cohorts/**
                    patterns.1: /api/v1/cohort-memberships/**
                    patterns.2: /api/v1/teams/**
                    patterns.3: /api/v1/spaces/**
                    patterns.4: /api/v1/admin/spaces/**
                    patterns.5: /api/v1/community/posts/**
                    patterns.6: /api/v1/gamification/**
                    patterns.7: /api/v1/user-profiles/**
                    patterns.8: /api/v1/telegram/**
                    patterns.9: /api/v1/chat/**
                    patterns.10: /api/v1/vacancy-alerts/**

            # Learning 내 회의실 점유 상태 조회 Endpoint만 외부 공개
            - id: learning-service-my-occupancy-route
              uri: ${LEARNING_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/occupancies/me
                - name: Method
                  args:
                    methods.0: GET

            # Telegram 서버 Callback: JWT 없이 허용하는 POST 전용 경로
            # 기존 Learning Route에 Method=POST를 추가하면 사용자 API까지 POST로 제한되므로 별도 Route 구성
            - id: learning-service-webhook-route
              uri: ${LEARNING_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/webhooks/telegram
                - name: Method
                  args:
                    methods.0: POST

            - id: rule-service-route
              uri: ${RULE_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/rules/**
                    patterns.1: /api/v1/flows/**

            # Rule Engine 인스턴스 목록 조회만 외부 운영 확인용으로 공개
            # 복구 Replay와 내부 Engine API는 Gateway Route 미등록 유지
            - id: rule-service-engine-list-route
              uri: ${RULE_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/engines
                - name: Method
                  args:
                    methods.0: GET

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  # Trace 전파 유지, Collector 전송은 운영 환경에서만 활성화
  opentelemetry:
    tracing:
      export:
        max-queue-size: 1024
        max-batch-size: 128
        schedule-delay: 5s
        timeout: 3s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 2s
      limits:
        max-attributes: 32
        max-attribute-value-length: 256
        max-events: 8
  metrics:
    distribution:
      # p95 집계용 고정 Bucket, Route·상태 조합별 Series 증가량 제한
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
  structured:
    json:
      # ECS 필드와 중복되는 Micrometer MDC 원본 이름 제외
      exclude:
        - traceId
        - spanId

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
