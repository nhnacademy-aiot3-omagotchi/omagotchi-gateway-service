server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

          default-filters: # 외부에서 온 헤더를 신뢰하지 않고, 다시 만들지도 않음
            - name: RemoveRequestHeader
              args:
                name: X-User-Id
            - name: RemoveRequestHeader
              args:
                name: X-Global-Role

          routes:
            - id: identity-service-route
              uri: ${IDENTITY_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/v1/auth/**
                    patterns.1: /api/v1/users/**

            - id: learning-service-route
              uri: ${LEARNING_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/cohorts/**
                    patterns.1: /api/cohort-memberships/**
                    patterns.2: /api/v1/cohorts/**
                    patterns.3: /api/telegram/**

            - id: rule-service-route
              uri: ${RULE_SERVICE_URI}
              predicates:
                - name: Path
                  args:
                    patterns.0: /api/rules/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
